apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stylehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: kamakshi97/stylehub-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: USER_SERVICE_URL
          value: http://user-service:8000
        - name: INVENTORY_SERVICE_URL
          value: http://inventory-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stylehub
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: frontend