apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: stylehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: stylehub-inventory-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stylehub-secrets
              key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: stylehub
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: inventory-service